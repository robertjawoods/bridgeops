name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    # Grants the job the Infisical machine-identity secrets, which varlock needs to
    # resolve `infisical()` values in the .env.schema files during build and check.
    environment: "BridgeOps / development"
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      # Declared @required in apps/web/.env.schema with no infisical() source, so
      # they come from the environment. Locally that is the gitignored apps/web/.env.
      # Nothing in CI dials these out; they only need to satisfy the schema's types.
      EMAIL_ADDRESS: bridgeops@resend.dev
      API_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # web imports @bridgeops/api and @bridgeops/database, both of which resolve
      # their types from dist/. Without this the svelte-check step cannot find the
      # modules. Covers `prisma generate`, which is the first half of the database
      # package's build script.
      - name: Build workspace packages
        run: pnpm turbo build --filter=@bridgeops/database --filter=@bridgeops/api

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck web
        run: pnpm --filter web check

      # The integration project starts its own Postgres via Testcontainers, using the
      # Docker daemon already present on ubuntu-latest. No `services:` block needed.
      - name: Test
        run: pnpm test
